<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - DRONO</title>
        <link rel="stylesheet" href="/styles/register.css">
    </head>
    <body>
        <header>
            <img src="/resources/pngwing.com.png" alt="icon">
            <nav>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </nav>
            <button><a href="/html/login.html">Sign in</a></button>
        </header>

        <div class="cvc">
            <div class="a1">
                <img src="/resources/pngwing.com.png" alt="icon">
                <h1>Register</h1>
            </div>

            <form id="registrationForm">
                <div class="form-group">
                    <input type="text" id="fullName" name="fullName" required>
                    <label for="fullName">Full Name *</label>
                    <span class="error-msg" id="nameError"></span>
                </div>

                <div class="form-group">
                    <input type="email" id="email" name="email" required>
                    <label for="email">Email Address *</label>
                    <span class="error-msg" id="emailError"></span>
                </div>

                <div class="form-group">
                    <input type="text" id="username" name="username" required>
                    <label for="username">Username *</label>
                    <span class="error-msg" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <input type="password" id="password" name="password" required>
                    <label for="password">Password *</label>
                    <button type="button" class="show-password-btn" onclick="togglePassword('password')">Show</button>
                    <span class="error-msg" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <input type="password" id="confirmPassword"
                        name="confirmPassword" required>
                    <label for="confirmPassword">Confirm Password *</label>
                    <span class="error-msg" id="confirmPasswordError"></span>
                </div>

                <div id="passwordMatchMessage"></div>

                <div class="terms">
                    <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                    <label for="agreeTerms">I agree to the Terms & Conditions</label>
                </div>

                <p>Already have an account? <a href="login.html">Login here</a></p>

                <button type="submit" id="registerBtn" disabled>Create Account</button>
            </form>
        </div>

        <footer>
            <div class="c1">
                <h3>Contact Us</h3>
                <p>Email: support@drono.com</p>
            </div>
            <div class="c1">
                <h3>Quick Links</h3>
                <nav>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </nav>
            </div>
            <p>© 2024 DRONO. All rights reserved.</p>
        </footer>

        <script src="/js/register.js"></script>
    </body>
</html>
